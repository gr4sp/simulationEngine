plugins {
    id 'java'
}

group = 'gr4sp'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
            exclude 'test/**'
        }
    }
    test {
        java { srcDirs = ['src/test/java'] }
    }
}

dependencies {
    // Non-updatable local JARs (MASON, Java3D, JMF, iText, jfreechart, bsh, portfolio)
    implementation fileTree(dir: 'libraries', include: ['*.jar'])

    // Updatable dependencies via Maven Central
    implementation 'org.postgresql:postgresql:42.7.7'
    implementation 'com.opencsv:opencsv:5.10'
    implementation 'com.esotericsoftware.yamlbeans:yamlbeans:1.17'

    // Test
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Pass-through for regenerating the simulation regression baseline:
    // ./gradlew test --tests core.SimulationRegressionIT -Dgr4sp.updateBaseline=true
    if (System.getProperty('gr4sp.updateBaseline') != null) {
        systemProperty 'gr4sp.updateBaseline', System.getProperty('gr4sp.updateBaseline')
    }
    // Run the suite under a different ambient timezone, to check that Gr4spSim.TIMEZONE
    // still pins results independently of the machine:
    //   ./gradlew test --tests core.SimulationRegressionIT -Dgr4sp.tz=UTC
    // Before that pin existed this failed, because simulation output depended on the
    // JVM default timezone. It must now pass for any value.
    if (System.getProperty('gr4sp.tz') != null) {
        systemProperty 'user.timezone', System.getProperty('gr4sp.tz')
    }
}

compileJava.options.encoding = 'UTF-8'

// Assemble the full runtime classpath (local libraries/ jars + Maven-resolved
// dependencies) into a single folder so the launch scripts (runGr4sp*.bat/.sh)
// and the Python/JPype experiment connectors can build a classpath without
// hardcoding jar versions. Regenerated on every build; not committed (build/ is
// gitignored). This is the single source of truth for the runtime classpath.
tasks.register('copyRuntimeLibs', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('runtime-libs')
}
tasks.named('build') { finalizedBy 'copyRuntimeLibs' }

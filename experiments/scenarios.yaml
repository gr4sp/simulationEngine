# GR4SP scenario definitions (task 3.1a consolidation).
# Generated from the original gr4spModel<X>.py by _extract_scenarios.py,
# then version-controlled as the single source of truth. Add a new
# scenario by appending a block under `scenarios:`.
outcomes:
  timeseries:
  - TIMEYear
  - consumptionYear
  - tariffsYear
  - primaryWholesalePriceYear
  - GHGYear
  - numConsumersYear
  - primarySpotProductionYear
  - secondarySpotProductionYear
  - offSpotProductionYear
  - renewableContributionYear
  - rooftopPVProductionYear
  - coalProductionYear
  - waterProductionYear
  - windProductionYear
  - gasProductionYear
  - solarProductionYear
  - BatteryProductionYear
  - numActorsYear
  - primaryUnmetDemandMwh
  - primaryUnmetDemandHours
  - primaryUnmetDemandDays
  - primaryMaxUnmetDemandMwhPerHour
  - secondaryUnmetDemandMwh
  - secondaryUnmetDemandHours
  - secondaryUnmetDemandDays
  - secondaryMaxUnmetDemandMwhPerHour
  scalar:
  - seedExperimentCsv
scenarios:
  BAU:
    model_type: afterBaseYear
    after_base_year_energy_efficiency_zero: true
    uncertainties:
    - name: energyEfficiency
      type: categorical
      categories:
      - 0
      - 1
    constants:
      consumption: 0
      annualCpi: 2.33
      annualInflation: 3.3
      onsiteGeneration: 0
      solarUptake: 0
      rooftopPV: 7
      domesticConsumptionPercentage: 30
      includePublicallyAnnouncedGen: 0
      generationRolloutPeriod: 1
      generatorRetirement: 0
      technologicalImprovement: 1
      learningCurve: 5
      importPriceFactor: 29
      priceChangePercentageBattery: 0
      priceChangePercentageBrownCoal: 0
      priceChangePercentageOcgt: 0
      priceChangePercentageCcgt: 0
      priceChangePercentageWind: 0
      priceChangePercentageWater: 0
      priceChangePercentageSolar: 0
      nameplateCapacityChangeBattery: 0
      nameplateCapacityChangeBrownCoal: 0
      nameplateCapacityChangeOcgt: 0
      nameplateCapacityChangeCcgt: 0
      nameplateCapacityChangeWind: 0
      nameplateCapacityChangeWater: 0
      nameplateCapacityChangeSolar: 0
      wholesaleTariffContribution: 28.37
      scheduleMinCapMarketGen: 300
      semiScheduleGenSpotMarket: 8
      semiScheduleMinCapMarketGen: 300
      nonScheduleGenSpotMarket: 10
      nonScheduleMinCapMarketGen: 1
    run:
      n_processes: 1
      scenarios: 1
      policies: 1
      sampling: null
      generate_only: false
      uncertainty_file: null
